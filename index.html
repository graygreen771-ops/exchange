<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Exchange | Terminal Node</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        surface: '#121212',
                        mutedAccent: '#d4af37'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian text-neutral-200 min-h-screen font-mono selection:bg-mutedAccent selection:text-black">

    <div class="max-w-xl mx-auto p-4 border-x border-neutral-900 min-h-screen flex flex-col">
        <!-- Header & User Identity -->
        <header class="py-6 border-b border-neutral-900 flex justify-between items-center">
            <h1 class="text-xs tracking-widest uppercase text-mutedAccent font-bold">/// EXCHANGE_NODE</h1>
            <div id="userDisplay" class="text-[10px] text-neutral-400">
                <!-- User handle injected here -->
            </div>
        </header>

        <!-- Input Form to Post Exchange -->
        <section class="my-6 p-4 bg-surface border border-neutral-800">
            <h2 class="text-[10px] uppercase tracking-wider text-neutral-400 mb-4">Initialize New Trade Listing</h2>
            <form id="exchangeForm" class="space-y-3">
                <input type="text" id="userHandle" placeholder="Your Trader Handle / Alias" required
                    class="w-full bg-black border border-neutral-800 p-3 text-sm focus:border-mutedAccent outline-none text-neutral-100 placeholder-neutral-700">
                <input type="text" id="itemTitle" placeholder="Item Offering / Service" required
                    class="w-full bg-black border border-neutral-800 p-3 text-sm focus:border-mutedAccent outline-none text-neutral-100 placeholder-neutral-700">
                <input type="text" id="itemExchange" placeholder="Looking For In Return" required
                    class="w-full bg-black border border-neutral-800 p-3 text-sm focus:border-mutedAccent outline-none text-neutral-100 placeholder-neutral-700">
                <button type="submit" class="w-full bg-neutral-100 text-black font-bold py-3 text-xs uppercase tracking-widest hover:bg-mutedAccent transition-colors">
                    Broadcast Listing
                </button>
            </form>
        </section>

        <!-- Live Feed Container -->
        <section class="flex-1">
            <h2 class="text-[10px] uppercase tracking-wider text-neutral-500 mb-4">Active Exchange Network</h2>
            <div id="listingsFeed" class="space-y-3">
                <p class="text-xs text-neutral-600 italic">Synchronizing with node...</p>
            </div>
        </section>
    </div>

    <!-- Firebase & App Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbBC7zM8mYenkgrsLH",
            authDomain: "exchange-80685.firebaseapp.com",
            projectId: "exchange-80685",
            storageBucket: "exchange-80685.firebasestorage.app",
            messagingSenderId: "66317030115",
            appId: "1:66317030115:web:9ee1539",
            measurementId: "G-WVWKQBSG7E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('exchangeForm');
        const feed = document.getElementById('listingsFeed');
        const handleInput = document.getElementById('userHandle');
        const userDisplay = document.getElementById('userDisplay');

        // Remember user handle locally on phone
        const savedHandle = localStorage.getItem('p2p_handle');
        if (savedHandle) {
            handleInput.value = savedHandle;
            userDisplay.innerHTML = `NODE: <span class="text-mutedAccent">${escapeHtml(savedHandle)}</span>`;
        }

        handleInput.addEventListener('input', (e) => {
            localStorage.setItem('p2p_handle', e.target.value);
            userDisplay.innerHTML = `NODE: <span class="text-mutedAccent">${escapeHtml(e.target.value || 'ANONYMOUS')}</span>`;
        });

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const handle = handleInput.value.trim();
            const title = document.getElementById('itemTitle').value.trim();
            const exchange = document.getElementById('itemExchange').value.trim();

            try {
                await addDoc(collection(db, "listings"), {
                    handle: handle,
                    title: title,
                    exchangeFor: exchange,
                    createdAt: serverTimestamp()
                });
                document.getElementById('itemTitle').value = '';
                document.getElementById('itemExchange').value = '';
            } catch (error) {
                console.error("Error writing document: ", error);
            }
        });

        // Delete function for item owner
        window.deleteListing = async function(id) {
            try {
                await deleteDoc(doc(db, "listings", id));
            } catch (error) {
                console.error("Error deleting document: ", error);
            }
        }

        // Real-Time Listener
        const q = query(collection(db, "listings"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            feed.innerHTML = "";
            if (snapshot.empty) {
                feed.innerHTML = `<p class="text-xs text-neutral-600 italic">No active listings found.</p>`;
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const currentHandle = handleInput.value.trim();
                const isOwner = currentHandle && data.handle === currentHandle;

                const card = document.createElement('div');
                card.className = "p-4 bg-surface border border-neutral-800 hover:border-neutral-700 transition-all";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] uppercase text-neutral-500 block">Trader: @${escapeHtml(data.handle || 'Anonymous')}</span>
                            <span class="text-xs text-mutedAccent font-bold">${escapeHtml(data.title)}</span>
                        </div>
                        <span class="text-[9px] text-neutral-600 font-mono">LIVE</span>
                    </div>
                    <p class="text-xs text-neutral-400 mb-3">Wants: <span class="text-neutral-200">${escapeHtml(data.exchangeFor)}</span></p>
                    <div class="flex justify-between items-center pt-2 border-t border-neutral-900">
                        <span class="text-[9px] text-neutral-600">ID: ${docId.slice(0, 6)}...</span>
                        ${isOwner ? `<button onclick="deleteListing('${docId}')" class="text-[10px] text-red-400 hover:text-red-300 uppercase tracking-wider">Mark Sold / Delete</button>` : `<span class="text-[10px] text-neutral-600">Active Trade</span>`}
                    </div>
                `;
                feed.appendChild(card);
            });
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
