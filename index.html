<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Exchange | Rare Aesthetic</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0a',
                        surface: '#121212',
                        mutedAccent: '#d4af37'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian text-neutral-200 min-h-screen font-mono selection:bg-mutedAccent selection:text-black">

    <div class="max-w-xl mx-auto p-4 border-x border-neutral-900 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="py-6 border-b border-neutral-900 flex justify-between items-center">
            <h1 class="text-xs tracking-widest uppercase text-mutedAccent font-bold">/// EXCHANGE_NODE</h1>
            <span class="text-[10px] text-neutral-500 animate-pulse">● REALTIME_ACTIVE</span>
        </header>

        <!-- Input Form to Post Exchange -->
        <section class="my-6 p-4 bg-surface border border-neutral-800">
            <h2 class="text-[10px] uppercase tracking-wider text-neutral-400 mb-4">New Listing Entry</h2>
            <form id="exchangeForm" class="space-y-3">
                <input type="text" id="itemTitle" placeholder="Item Offering / Service" required
                    class="w-full bg-black border border-neutral-800 p-3 text-sm focus:border-mutedAccent outline-none text-neutral-100 placeholder-neutral-700">
                <input type="text" id="itemExchange" placeholder="Looking For In Return" required
                    class="w-full bg-black border border-neutral-800 p-3 text-sm focus:border-mutedAccent outline-none text-neutral-100 placeholder-neutral-700">
                <button type="submit" class="w-full bg-neutral-100 text-black font-bold py-3 text-xs uppercase tracking-widest hover:bg-mutedAccent transition-colors">
                    Broadcast Listing
                </button>
            </form>
        </section>

        <!-- Live Feed Container -->
        <section class="flex-1">
            <h2 class="text-[10px] uppercase tracking-wider text-neutral-500 mb-4">Active Network Feed</h2>
            <div id="listingsFeed" class="space-y-3">
                <p class="text-xs text-neutral-600 italic">Synchronizing with node...</p>
            </div>
        </section>
    </div>

    <!-- Firebase & App Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDbBC7zM8mYenkgrsLH",
            authDomain: "exchange-80685.firebaseapp.com",
            projectId: "exchange-80685",
            storageBucket: "exchange-80685.firebasestorage.app",
            messagingSenderId: "66317030115",
            appId: "1:66317030115:web:9ee1539",
            measurementId: "G-WVWKQBSG7E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('exchangeForm');
        const feed = document.getElementById('listingsFeed');

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('itemTitle').value;
            const exchange = document.getElementById('itemExchange').value;

            try {
                await addDoc(collection(db, "listings"), {
                    title: title,
                    exchangeFor: exchange,
                    createdAt: serverTimestamp()
                });
                form.reset();
            } catch (error) {
                console.error("Error writing document: ", error);
            }
        });

        // Real-Time Listener (Updates across all platforms instantly)
        const q = query(collection(db, "listings"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            feed.innerHTML = "";
            if (snapshot.empty) {
                feed.innerHTML = `<p class="text-xs text-neutral-600 italic">No active listings found.</p>`;
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = "p-4 bg-surface border border-neutral-800 hover:border-neutral-600 transition-all";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs text-mutedAccent font-bold">${escapeHtml(data.title)}</span>
                        <span class="text-[9px] text-neutral-600 font-mono">LIVE_SYNC</span>
                    </div>
                    <p class="text-xs text-neutral-400">Wants: <span class="text-neutral-200">${escapeHtml(data.exchangeFor)}</span></p>
                `;
                feed.appendChild(card);
            });
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
